# Alembic config for the Lists API.
#
# The database URL is NOT set here — env.py reads it from the DATABASE_URL
# environment variable (falling back to the dev SQLite file), so migrations
# target the same database as the app (app/db.py). Run from backend/:
#
#   python -m alembic upgrade head                     # apply migrations
#   python -m alembic revision --autogenerate -m "msg" # generate a new one
#
[alembic]
script_location = alembic
prepend_sys_path = .
# Use a date-ordered, readable slug for new revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
