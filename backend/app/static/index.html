<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Lists — Dev Harness</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --line: #e3e3e8; --ink: #1d1d1f;
    --muted: #6b6b73; --accent: #c0392b; --accent-ink: #fff; --ok: #1f8a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 18px; padding: 10px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 4px; }
  /* The `hidden` attribute must beat these explicit `display:flex` rules — an
     author `display` wins over the UA `[hidden]{display:none}`, so without this
     nav/who stay visible on the login screen and after logout. An attribute +
     element/class selector outranks the plain rules above. */
  nav[hidden], .who[hidden] { display: none; }
  nav a {
    text-decoration: none; color: var(--muted); font-weight: 600; padding: 6px 12px;
    border-radius: 7px; font-size: 14px;
  }
  nav a:hover { background: #f0f0f2; }
  nav a.active { background: #fbeae7; color: var(--accent); }
  header .who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  header input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  main { padding: 16px 20px; }
  .two-col { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #f0f0f2; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.tiny { padding: 2px 7px; font-size: 12px; }
  button.want { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  button.want:hover { background: #e7f6ec; }
  button.want.saved { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.want.saved:hover { filter: brightness(1.06); background: var(--ok); }
  button.link { border: none; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; }
  button.link:hover { background: none; text-decoration: underline; }
  input, select, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
  select.addto { max-width: 150px; }
  /* Add-to-list picker (all lists + membership checkmarks) */
  .listpick { position: relative; display: inline-block; }
  .listpick > summary {
    list-style: none; cursor: pointer; user-select: none;
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; color: var(--ink); white-space: nowrap;
  }
  .listpick > summary::-webkit-details-marker { display: none; }
  .listpick > summary:hover { background: #f0f0f2; }
  .listpick[open] > summary { background: #f0f0f2; }
  .listpick-menu {
    position: absolute; z-index: 10; margin-top: 4px; min-width: 180px; max-height: 240px;
    overflow-y: auto; background: #fff; border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 22px rgba(0,0,0,.12); padding: 6px;
  }
  .listpick-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .listpick-row:hover { background: #f0f0f2; }
  .new-list-btn { width: 100%; margin-top: 10px; font-weight: 600; }
  .list-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .list-row:hover { background: #f0f0f2; }
  .list-row.active { background: #fbeae7; }
  .list-row .name { flex: 1; font-weight: 600; }
  .list-row .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 6px; }
  .badge.saved { background: #e7f6ec; color: var(--ok); }
  .badge.visited { background: #efe7f6; color: #6a3a8a; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .card .title { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .tags { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .note { color: var(--ink); font-size: 13px; margin-top: 4px; font-style: italic; }
  .visits { color: var(--ok); font-size: 12px; margin-top: 4px; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 80vw;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--accent); }
  /* Lookup: two-column layout (search + filters sidebar left, results right) */
  .lookup-cols { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  .lookup-search input#s-q { width: 100%; }
  .lookup-actions { display: flex; gap: 8px; margin: 10px 0 2px; }
  .lookup-actions .grow { flex: 1; }
  /* Filter set with a single master show/hide toggle. */
  .facets-head { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .filters-toggle { color: var(--accent); font-weight: 600; font-size: 12px; }
  .lookup-facets { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
  /* The `hidden` attribute must beat `display:flex` (author display wins over the
     UA [hidden] rule), or the master toggle can't hide the filters. */
  .lookup-facets[hidden] { display: none; }
  .facet-group { display: flex; flex-direction: column; gap: 6px; }
  .facet-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  .facet-group select { width: 100%; }
  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip-toggle { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 3px 12px; font-size: 13px; cursor: pointer; }
  .chip-toggle:hover { background: #f0f0f2; }
  .chip-toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 760px) { .lookup-cols { grid-template-columns: 1fr; } }
  /* Generic stacked label+input field (modals add their own top margin). */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  /* Recommendations page */
  .rec-filters { display: grid; grid-template-columns: 1fr 110px 1fr 90px; gap: 10px; margin-top: 12px; }
  .score { font-weight: 700; font-size: 12px; color: var(--accent); background: #fbeae7;
    border-radius: 6px; padding: 2px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .reasons { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .reasons li { margin: 1px 0; }
  @media (max-width: 720px) { .rec-filters { grid-template-columns: 1fr; } }
  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 380px; max-width: 92vw; }
  .modal.wide { width: 520px; }
  .modal h3 { margin: 0 0 4px; }
  .modal .field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .modal .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal .close-x { float: right; border: none; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0; }
  .modal .close-x:hover { color: var(--ink); background: none; }
  /* Detail view */
  .detail-sub { color: var(--muted); margin: 2px 0 12px; }
  .detail-sec { margin-top: 14px; }
  .detail-sec h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .hours-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
  .hours-grid .day { color: var(--muted); }
  .hours-grid .today { font-weight: 700; color: var(--ink); }
  .hours-grid .today .day, .hours-grid .today.day { color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #eef; color: #3a3a8a; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .kv { font-size: 13px; }
  .kv b { font-weight: 600; }
  .visit-log { display: flex; flex-direction: column; }
  .visit-entry { padding: 6px 0; border-top: 1px solid var(--line); }
  .visit-entry:first-child { border-top: none; padding-top: 0; }
  .visit-entry .note { margin-top: 2px; }
  .detail-scroll { max-height: 62vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } .search-filters { grid-template-columns: 1fr; } .modal.wide { width: 92vw; } }
  /* Auth / landing */
  .landing {
    display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center;
    max-width: 940px; margin: 0 auto; padding: 6vh 8px 4vh; min-height: 78vh;
  }
  .landing-hero .brand { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .landing-hero .brand span {
    background: linear-gradient(90deg, var(--accent), #e07a2f);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .landing-hero h2 { font-size: 30px; line-height: 1.15; margin: 18px 0 10px; color: var(--ink); }
  .landing-hero .lede { color: var(--muted); font-size: 15px; max-width: 40ch; margin: 0 0 22px; }
  .landing-feats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .landing-feats li { display: flex; gap: 12px; align-items: flex-start; font-size: 13px; color: var(--muted); }
  .landing-feats li span { font-size: 20px; line-height: 1.2; }
  .landing-feats li b { color: var(--ink); }
  .auth-card { width: 100%; max-width: 400px; justify-self: center; }
  .auth-card h2 { text-transform: none; letter-spacing: 0; font-size: 20px; color: var(--ink); margin: 0 0 4px; }
  .auth-card .field { margin-top: 14px; }
  .auth-card .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .auth-card .name-row .field { margin-top: 0; }
  .auth-err { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .auth-submit { width: 100%; padding: 9px; margin-top: 14px; font-weight: 600; }
  .show-pass { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .auth-toggle-line { font-size: 13px; text-align: center; margin: 14px 0 0; }
  .auth-toggle-line .link { color: var(--accent); font-weight: 600; }
  @media (max-width: 780px) {
    .landing { grid-template-columns: 1fr; gap: 22px; padding-top: 3vh; min-height: 0; }
    .landing-hero { text-align: center; }
    .landing-hero .brand, .landing-feats li { justify-content: center; }
    .landing-hero .lede { margin-left: auto; margin-right: auto; }
    .landing-feats li { text-align: left; }
    .auth-card { order: -1; }
  }
</style>
</head>
<body>
<header>
  <h1>🍽️ Restaurant Lists</h1>
  <nav id="nav" hidden>
    <a href="#/lookup" id="nav-lookup">Find Restaurants</a>
    <a href="#/recommend" id="nav-recommend">Recommendations</a>
    <a href="#/lists" id="nav-lists">My Lists</a>
  </nav>
  <div class="who" id="who" hidden>
    <span id="user-label">…</span>
    <button class="tiny" id="logout-btn" onclick="doLogout()">Log out</button>
  </div>
</header>

<main id="content"></main>

<!-- Log-visit modal -->
<div class="modal-backdrop" id="visit-modal">
  <div class="modal">
    <h3 id="visit-modal-title">Log a visit</h3>
    <div class="muted" id="visit-modal-sub"></div>
    <div class="field">
      <label>Sentiment</label>
      <select id="v-sentiment">
        <option value="">— none —</option>
        <option value="loved">Loved it</option>
        <option value="liked">Liked it</option>
        <option value="wouldnt_return">Wouldn't return</option>
      </select>
    </div>
    <div class="field">
      <label>Rating (1–5)</label>
      <select id="v-rating">
        <option value="">— none —</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="v-date" />
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="v-notes" rows="2" placeholder="What did you have? Who with?"></textarea>
    </div>
    <div class="modal-actions">
      <button onclick="closeVisit()">Cancel</button>
      <button class="primary" id="v-submit" onclick="submitVisit()">Log visit</button>
    </div>
  </div>
</div>

<!-- Restaurant detail modal -->
<div class="modal-backdrop" id="detail-modal">
  <div class="modal wide">
    <button class="close-x" onclick="closeDetail()" title="Close">×</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- Edit note & tags modal -->
<div class="modal-backdrop" id="note-modal">
  <div class="modal">
    <h3>Note &amp; tags</h3>
    <div class="muted" id="note-modal-sub"></div>
    <div class="field">
      <label>Note</label>
      <textarea id="n-note" rows="3" placeholder="A private note about this place…"></textarea>
    </div>
    <div class="field">
      <label>Tags (comma-separated)</label>
      <input id="n-tags" placeholder="e.g. date night, cheap eats, outdoor" />
    </div>
    <div class="modal-actions">
      <button onclick="closeNote()">Cancel</button>
      <button class="primary" onclick="submitNote()">Save</button>
    </div>
  </div>
</div>

<!-- Create-list modal -->
<div class="modal-backdrop" id="list-modal">
  <div class="modal">
    <h3>Create a new list</h3>
    <p class="muted" style="margin:0 0 4px">Group restaurants any way you like — a trip, a craving, a night out.</p>
    <div class="field">
      <label>List name</label>
      <input id="cl-name" placeholder="e.g. Date night spots" />
    </div>
    <div id="cl-err" class="auth-err"></div>
    <div class="modal-actions">
      <button onclick="closeListModal()">Cancel</button>
      <button class="primary" onclick="submitNewList()">Create list</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const state = {
  lists: [], token: localStorage.getItem("rl_token") || "", me: null, route: "lookup",
  selectedListId: null, results: null, listFilter: "",
  visitsByRestaurant: {},   // restaurant_id -> [visits]
  savedIn: {},              // restaurant_id -> Set(list types) for badges on lookup
  listMembership: {},       // restaurant_id -> Set(list ids) for the add-to-list picker
  pendingVisit: null,       // {restaurantId, name}
  pendingNote: null,        // {listId, restaurantId} for the note/tags modal
  cuisines: [],             // [{name, count}] for the search-bar typeahead
  itemSort: "added",        // My Lists sort key: added|name|price|rating|tag
  detailCache: {},          // restaurant_id -> full restaurant record (with attributes)
  // Lookup filters, persisted so a re-render (e.g. after a save) keeps them.
  // price: array of exact levels; cuisine: array of names; rating: min-rating
  // string ("" = any); hours: "any" | "open_now" | "open_24h".
  search: { q: "", cuisine: [], price: [], rating: "", hours: "any" },
  filtersOpen: true,        // master show/hide for the whole lookup filter set
  searchSeq: 0,             // live-search request sequence guard
  // Recommendations tab form + last result (persisted across re-renders).
  recommend: { query: "", near: "", price: "", cuisine: "", party: 2, openNow: false, result: null },
};

// ---- API helper (same-origin; optional X-User-Id header) ----
// Retries transient network errors ("Failed to fetch"): uvicorn's dev server on
// Windows occasionally resets a keep-alive connection, which surfaces as a
// rejected fetch even though the request is valid. HTTP errors (4xx/5xx) are
// real and are NOT retried.
const sleep = ms => new Promise(r => setTimeout(r, ms));
// Trailing-edge debounce: coalesce rapid calls (e.g. keystrokes) into one.
// The returned function carries a .cancel() to drop any pending invocation.
function debounce(fn, ms) {
  let t;
  const wrapped = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  wrapped.cancel = () => clearTimeout(t);
  return wrapped;
}
async function api(method, path, body, _attempt = 0) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (netErr) {
    if (_attempt < 3) { await sleep(120 * (_attempt + 1)); return api(method, path, body, _attempt + 1); }
    throw new Error("Network error — is the server running? (" + netErr.message + ")");
  }
  // A 401 on an authenticated request means the session lapsed — drop it and
  // return to the login screen. Login/signup calls carry no token, so their
  // 401s fall through to the caller (which shows the message) instead.
  if (res.status === 401 && state.token) {
    clearSession(); renderAuthGate();
    throw new Error("Your session expired — please log in again.");
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);
  return data;
}
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 2600);
}
const price = n => (n ? "$".repeat(n) : "—");
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CORE = { want_to_try: "Want to Try", visited: "Visited" };

// ---- Auth (local email/password accounts; token persisted in localStorage) ----
function clearSession() {
  state.token = ""; state.me = null; localStorage.removeItem("rl_token");
}
function setSession(token, user) {
  state.token = token; state.me = user; localStorage.setItem("rl_token", token);
}
function setChrome(authed) {
  document.getElementById("nav").hidden = !authed;
  document.getElementById("who").hidden = !authed;
  // Clear the identity label when logging out so no stale name lingers in the
  // header chrome (the panel is hidden, but don't leave the old value behind).
  if (!authed) document.getElementById("user-label").textContent = "…";
}
async function doSignup(fields) {
  // fields: { email, password, username, first_name, last_name }
  const { token, user } = await api("POST", "/auth/signup", fields);
  setSession(token, user);
  await boot();
  toast("Welcome, " + (user.display_name || user.first_name || user.email) + "!");
}
async function doLogin(email, password) {
  const { token, user } = await api("POST", "/auth/login", { email, password });
  setSession(token, user);
  await boot();
  toast("Welcome back!");
}
async function doLogout() {
  try { await api("POST", "/auth/logout"); } catch (e) { /* best effort */ }
  clearSession();
  state.lists = []; state.selectedListId = null; state.results = null;
  renderAuthGate();
}
// API error detail comes through JSON.stringify'd; unwrap to a plain sentence.
function humanizeAuthError(msg) {
  try {
    const p = JSON.parse(msg);
    if (typeof p === "string") return p;
    if (Array.isArray(p) && p[0] && p[0].msg) return p[0].msg;  // pydantic 422
  } catch (_) {}
  return String(msg).replace(/^"|"$/g, "");
}
const _looksLikeEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
function renderAuthGate(mode = "login") {
  setChrome(false);
  const isSignup = mode === "signup";
  document.getElementById("content").innerHTML = `
    <div class="landing">
      <section class="landing-hero">
        <div class="brand">🍽️ <span>Restaurant Lists</span></div>
        <h2>${isSignup ? "Find your next favorite spot." : "Welcome back."}</h2>
        <p class="lede">Keep everywhere you want to try and everywhere you've loved in one place —
          then get picks tuned to your taste.</p>
        <ul class="landing-feats">
          <li><span>🔖</span><div><b>Save &amp; organize.</b> Want-to-Try, Visited, and your own custom lists.</div></li>
          <li><span>📝</span><div><b>Remember the details.</b> Notes, tags, ratings, and full visit history per place.</div></li>
          <li><span>✨</span><div><b>Personalized picks.</b> Recommendations ranked from your own history.</div></li>
        </ul>
      </section>
      <section class="panel auth-card">
        <h2>${isSignup ? "Create your account" : "Log in"}</h2>
        <p class="muted" style="margin:0 0 6px">${isSignup
          ? "It's free — start building your lists in seconds."
          : "Pick up right where you left off."}</p>
        <div class="field"><label>Email</label>
          <input id="a-email" type="email" autocomplete="username" placeholder="you@example.com" /></div>
        ${isSignup ? `<div class="name-row">
          <div class="field"><label>First name</label>
            <input id="a-first" autocomplete="given-name" placeholder="First" /></div>
          <div class="field"><label>Last name</label>
            <input id="a-last" autocomplete="family-name" placeholder="Last" /></div>
        </div>
        <div class="field"><label>Username</label>
          <input id="a-username" autocomplete="off" placeholder="yourhandle" /></div>` : ""}
        <div class="field"><label>Password</label>
          <input id="a-pass" type="password" autocomplete="${isSignup ? "new-password" : "current-password"}"
            placeholder="${isSignup ? "At least 8 characters" : ""}" /></div>
        ${isSignup ? `<div class="field"><label>Confirm password</label>
          <input id="a-pass2" type="password" autocomplete="new-password" placeholder="Re-enter your password" /></div>
        <label class="show-pass"><input type="checkbox" id="a-show" /> Show password</label>` : ""}
        <div id="a-err" class="auth-err"></div>
        <button class="primary auth-submit" id="a-submit">${isSignup ? "Create account" : "Log in"}</button>
        <p class="auth-toggle-line">${isSignup ? "Already have an account?" : "New here?"}
          <button class="link" id="a-toggle">${isSignup ? "Log in" : "Create an account"}</button></p>
      </section>
    </div>`;
  const err = document.getElementById("a-err");
  const setErr = m => { err.textContent = m; };
  const submit = async () => {
    const email = document.getElementById("a-email").value.trim();
    const pass = document.getElementById("a-pass").value;
    setErr("");
    // Client-side validation with specific, friendly messages (the server
    // re-validates and 409s on a taken email).
    if (!email) return setErr("Please enter your email address.");
    if (isSignup && !_looksLikeEmail(email)) return setErr("That doesn't look like a valid email address.");
    let signupFields = null;
    if (isSignup) {
      const first = document.getElementById("a-first").value.trim();
      const last = document.getElementById("a-last").value.trim();
      const username = document.getElementById("a-username").value.trim();
      if (!first || !last) return setErr("Please enter your first and last name.");
      if (!/^[A-Za-z0-9_]{3,30}$/.test(username))
        return setErr("Username must be 3–30 letters, numbers, or underscores.");
      signupFields = { email, password: pass, username, first_name: first, last_name: last };
    }
    if (!pass) return setErr("Please enter your password.");
    if (isSignup) {
      if (pass.length < 8) return setErr("Password must be at least 8 characters.");
      if (pass !== document.getElementById("a-pass2").value) return setErr("The passwords don't match.");
    }
    document.getElementById("a-submit").disabled = true;
    try {
      if (isSignup) await doSignup(signupFields);
      else await doLogin(email, pass);
    } catch (e) {
      setErr(humanizeAuthError(e.message));
      document.getElementById("a-submit").disabled = false;
    }
  };
  document.getElementById("a-submit").onclick = submit;
  document.getElementById("a-toggle").onclick = () => renderAuthGate(isSignup ? "login" : "signup");
  const show = document.getElementById("a-show");
  if (show) show.addEventListener("change", () => {
    const t = show.checked ? "text" : "password";
    document.getElementById("a-pass").type = t;
    document.getElementById("a-pass2").type = t;
  });
  for (const id of ["a-email", "a-first", "a-last", "a-username", "a-pass", "a-pass2"]) {
    const el = document.getElementById(id);
    if (el) el.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  }
  document.getElementById("a-email").focus();
}

// ---- Shared data load ----
async function loadCore() {
  state.lists = await api("GET", "/lists");
  if (!state.selectedListId && state.lists.length) {
    const want = state.lists.find(l => l.type === "want_to_try");
    state.selectedListId = (want || state.lists[0]).id;
  }
  // Visit history (for counts) + a map of which core lists a restaurant is in.
  const visits = await api("GET", "/visits");
  const vmap = {};
  for (const v of visits) (vmap[v.restaurant_id] = vmap[v.restaurant_id] || []).push(v);
  state.visitsByRestaurant = vmap;

  // One pass over every list builds both: savedIn (core-list types, for badges)
  // and listMembership (all list ids, for the add-to-list picker's checkmarks).
  const saved = {};
  const membership = {};
  for (const l of state.lists) {
    const items = await api("GET", `/lists/${l.id}/items`);
    for (const it of items) {
      (membership[it.restaurant_id] = membership[it.restaurant_id] || new Set()).add(l.id);
      if (l.type === "want_to_try" || l.type === "visited")
        (saved[it.restaurant_id] = saved[it.restaurant_id] || new Set()).add(l.type);
    }
  }
  state.savedIn = saved;
  state.listMembership = membership;
}

// ---- Add-to custom list (core lists have dedicated Want-to-Try / Log-visit buttons) ----
async function addToList(restaurantId, listId) {
  const l = state.lists.find(x => x.id === listId);
  try {
    await api("POST", `/lists/${listId}/items`, { restaurant_id: restaurantId });
    await loadCore();
    render();
    toast(`Added to “${l ? l.name : "list"}”`);
  } catch (e) {
    if (String(e.message).includes("already in this list")) toast("Already in that list");
    else toast("Add failed: " + e.message, true);
  }
}

// ---- Visit modal ----
// Local (not UTC) YYYY-MM-DD for today, used as the date picker's max so future
// visits can't be selected. The server enforces this too (POST /visits 422s).
function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// Open the visit modal. Pass `visit` to edit an existing log (pre-fills fields
// and PATCHes on save); omit it to create. `returnToDetail` reopens the detail
// modal after saving (used when editing from a restaurant's visit history).
function openVisit(restaurantId, name, visit = null, returnToDetail = false) {
  state.pendingVisit = { restaurantId, name, visitId: visit ? visit.id : null, returnToDetail };
  document.getElementById("visit-modal-sub").textContent = name;
  document.getElementById("v-sentiment").value = (visit && visit.sentiment) || "";
  document.getElementById("v-rating").value = visit && visit.user_rating ? String(visit.user_rating) : "";
  document.getElementById("v-notes").value = (visit && visit.notes) || "";
  const dateEl = document.getElementById("v-date");
  dateEl.value = visit && visit.visited_at ? String(visit.visited_at).slice(0, 10) : "";
  dateEl.max = todayLocalISO();   // no future dates in the picker
  document.getElementById("visit-modal-title").textContent = visit ? "Edit visit" : "Log a visit";
  document.getElementById("v-submit").textContent = visit ? "Save changes" : "Log visit";
  document.getElementById("visit-modal").classList.add("show");
}
function closeVisit() {
  state.pendingVisit = null;
  document.getElementById("visit-modal").classList.remove("show");
}
async function submitVisit() {
  if (!state.pendingVisit) return;
  const { restaurantId, name, visitId, returnToDetail } = state.pendingVisit;
  const s = document.getElementById("v-sentiment").value;
  const r = document.getElementById("v-rating").value;
  const notes = document.getElementById("v-notes").value.trim();
  const date = document.getElementById("v-date").value;
  if (date && date > todayLocalISO()) return toast("Visit date can't be in the future", true);
  const visitedAt = date ? new Date(date + "T12:00:00").toISOString() : null;

  let body;
  if (visitId) {
    // Edit: send fields explicitly so cleared ones (null) actually clear.
    body = { sentiment: s || null, user_rating: r ? Number(r) : null, notes: notes || null };
    if (date) body.visited_at = visitedAt;
  } else {
    body = { restaurant_id: restaurantId };
    if (s) body.sentiment = s;
    if (r) body.user_rating = Number(r);
    if (notes) body.notes = notes;
    if (visitedAt) body.visited_at = visitedAt;
  }
  try {
    if (visitId) await api("PATCH", `/visits/${visitId}`, body);
    else await api("POST", "/visits", body);
    closeVisit();
    await loadCore();
    render();
    if (returnToDetail) openDetail(restaurantId);   // bring back the (refreshed) detail view
    toast(visitId ? "Visit updated" : `Logged a visit to “${name}” (now in Visited)`);
  } catch (e) { toast((visitId ? "Update" : "Log visit") + " failed: " + e.message, true); }
}
async function deleteVisit(visitId, restaurantId) {
  if (!confirm("Delete this visit log? This can't be undone.")) return;
  try {
    await api("DELETE", `/visits/${visitId}`);
    await loadCore();
    render();
    // The detail modal is still open — refresh its visit history in place.
    if (document.getElementById("detail-modal").classList.contains("show")) openDetail(restaurantId);
    toast("Visit deleted");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}
function visitLine(restaurantId) {
  const vs = state.visitsByRestaurant[restaurantId] || [];
  if (!vs.length) return "";
  const last = vs[0].visited_at ? new Date(vs[0].visited_at).toLocaleDateString() : "";
  return `Visited ${vs.length}× ${last ? "· last " + last : ""}`;
}
const SENTIMENT_LABELS = { loved: "Loved it", liked: "Liked it", wouldnt_return: "Wouldn't return" };
// Full per-restaurant visit log (date · sentiment · rating · notes), newest
// first, for the detail modal. Reads the already-loaded state.visitsByRestaurant
// (populated by loadCore from GET /visits) — no extra request needed.
function visitHistoryHtml(restaurantId) {
  const vs = state.visitsByRestaurant[restaurantId] || [];
  if (!vs.length) return `<span class="muted">No visits logged yet.</span>`;
  return `<div class="visit-log">` + vs.map(v => {
    const date = v.visited_at
      ? new Date(v.visited_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })
      : "Undated";
    const bits = [];
    if (SENTIMENT_LABELS[v.sentiment]) bits.push(SENTIMENT_LABELS[v.sentiment]);
    if (v.user_rating) bits.push("★".repeat(v.user_rating));
    const meta = bits.length ? " · " + bits.join(" · ") : "";
    const notes = v.notes ? `<div class="note">“${esc(v.notes)}”</div>` : "";
    return `<div class="visit-entry"><div class="row">` +
      `<div class="kv grow"><b>${esc(date)}</b>${esc(meta)}</div>` +
      `<button class="tiny" data-vedit="${esc(v.id)}">Edit</button>` +
      `<button class="tiny" data-vdel="${esc(v.id)}">Delete</button>` +
      `</div>${notes}</div>`;
  }).join("") + `</div>`;
}

// ---- Core-list helpers ----
const coreListId = type => (state.lists.find(l => l.type === type) || {}).id;
const isSavedIn = (restaurantId, type) => (state.savedIn[restaurantId] || new Set()).has(type);

// Want-to-Try toggle: one-click save, click again to unsave. Clearer than the
// old catch-all "Add to…" dropdown that mixed core lists with custom ones.
async function toggleWantToTry(restaurantId, name) {
  const listId = coreListId("want_to_try");
  if (!listId) return toast("No Want-to-Try list", true);
  try {
    if (isSavedIn(restaurantId, "want_to_try")) {
      await api("DELETE", `/lists/${listId}/items/${restaurantId}`);
      await loadCore(); render(); toast(`Removed “${name}” from Want to Try`);
    } else {
      await api("POST", `/lists/${listId}/items`, { restaurant_id: restaurantId });
      await loadCore(); render(); toast(`Saved “${name}” to Want to Try`);
    }
  } catch (e) {
    if (String(e.message).includes("already in this list")) { await loadCore(); render(); }
    else toast("Failed: " + e.message, true);
  }
}
// Returns the Want-to-Try toggle, or null when the restaurant is already in
// Visited — offering "＋ Want to Try" there is confusing and clicking it would
// move an already-visited place back to Want-to-Try (evicting it from Visited).
// Once visited, "Log another visit" is the relevant action. Callers must handle
// a null return (skip appending).
function wantButton(restaurantId, name) {
  if (isSavedIn(restaurantId, "visited")) return null;
  const saved = isSavedIn(restaurantId, "want_to_try");
  const b = document.createElement("button");
  b.className = "want" + (saved ? " saved" : "");
  b.textContent = saved ? "✓ Want to Try" : "＋ Want to Try";
  b.title = saved ? "Remove from Want to Try" : "Save to Want to Try";
  b.onclick = () => toggleWantToTry(restaurantId, name);
  return b;
}
const isInList = (restaurantId, listId) => (state.listMembership[restaurantId] || new Set()).has(listId);

// Add-to-list picker: a disclosure listing EVERY list with a checkbox marking
// the ones this restaurant is already in (toggle to add/remove). Toggles hit the
// API and update local state optimistically so several can be flipped while the
// menu is open; closing the menu reconciles with the server and refreshes badges.
function listPickerControl(restaurantId) {
  if (!state.lists.length) return null;
  const det = document.createElement("details");
  det.className = "listpick";
  const sum = document.createElement("summary");
  sum.textContent = "＋ Add to list";
  det.appendChild(sum);
  const menu = document.createElement("div");
  menu.className = "listpick-menu";
  for (const l of state.lists) {
    const row = document.createElement("label");
    row.className = "listpick-row";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = isInList(restaurantId, l.id);
    cb.onchange = () => toggleListMembership(restaurantId, l.id, cb.checked, cb);
    row.appendChild(cb);
    const span = document.createElement("span");
    span.textContent = l.name + (l.type !== "custom" ? " · core" : "");
    row.appendChild(span);
    menu.appendChild(row);
  }
  det.appendChild(menu);
  // On close, reconcile with the server + refresh badges — but only if a
  // membership actually changed while open (avoids a needless re-render when the
  // menu is just opened and dismissed, e.g. by an outside click).
  det.addEventListener("toggle", () => {
    if (!det.open && det._changed) { det._changed = false; loadCore().then(render); }
  });
  return det;
}
async function toggleListMembership(restaurantId, listId, add, cb) {
  try {
    if (add) await api("POST", `/lists/${listId}/items`, { restaurant_id: restaurantId });
    else await api("DELETE", `/lists/${listId}/items/${restaurantId}`);
    const det = cb.closest("details.listpick");
    if (det) det._changed = true;   // flag so the close handler reconciles
    // Optimistic local update so further toggles in the open menu stay consistent.
    const set = state.listMembership[restaurantId] || (state.listMembership[restaurantId] = new Set());
    add ? set.add(listId) : set.delete(listId);
    const l = state.lists.find(x => x.id === listId);
    toast(add ? `Added to “${l ? l.name : "list"}”` : `Removed from “${l ? l.name : "list"}”`);
  } catch (e) {
    if (String(e.message).includes("already in this list")) { cb.checked = true; }
    else { cb.checked = !add; toast("Update failed: " + e.message, true); }
  }
}

// ---- Restaurant detail view ----
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const _todayName = () => DAYS[new Date().getDay()];
function fmtTime(t) { // "7:0" / "20:30" -> "7:00 AM" / "8:30 PM"
  const [hRaw, mRaw] = String(t).split(":");
  let h = parseInt(hRaw, 10); const m = (mRaw || "0").padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}
// --- YELP_SEED_HOURS (remove with the Yelp seed) -----------------------------
// The Yelp Open Dataset encodes both "closed for the day" and "open 24 hours" as
// the same zero-length "0:0-0:0" span, so it can't be rendered literally (it
// shows "12:00 AM – 12:00 AM"). We disambiguate by context: if *every* listed
// day is 0:0-0:0 the place is genuinely 24h (Wawa, McDonald's, diners — 102 in
// the seed); a lone 0:0-0:0 among real hours is a closed day (almost always the
// classic "closed Mondays" — 653 of 666 in the seed). This heuristic is specific
// to the Yelp seed and should be DELETED when the production data provider lands
// (KNOWN_ISSUES "Production data provider"), which is expected to supply explicit
// closed / 24-hour flags instead. Grep tag: YELP_SEED_HOURS.
const _ZERO_SPAN = "0:0-0:0";
function hoursHtml(hours) {
  if (!hours || !Object.keys(hours).length) return `<span class="muted">No hours on file.</span>`;
  const today = _todayName();
  const vals = Object.values(hours);
  const allDay = vals.length >= 6 && vals.every(v => v === _ZERO_SPAN);  // YELP_SEED_HOURS
  const spanFor = v => {
    if (!v) return "Closed";
    if (v === _ZERO_SPAN) return allDay ? "Open 24 hours" : "Closed";  // YELP_SEED_HOURS
    return v.split("-").map(fmtTime).join(" – ");
  };
  return `<div class="hours-grid">` + DAYS.map(d => {
    const cls = d === today ? " today" : "";
    return `<div class="day${cls}">${d}</div><div class="${cls.trim()}">${esc(spanFor(hours[d]))}</div>`;
  }).join("") + `</div>`;
}
// Human labels for the raw Yelp feature keys worth surfacing.
const FEATURE_LABELS = {
  RestaurantsTakeOut: "Takeout", RestaurantsDelivery: "Delivery",
  OutdoorSeating: "Outdoor seating", RestaurantsReservations: "Reservations",
  RestaurantsGoodForGroups: "Good for groups", GoodForKids: "Good for kids",
  BusinessAcceptsCreditCards: "Cards accepted", BikeParking: "Bike parking",
  WheelchairAccessible: "Wheelchair accessible", HasTV: "Has TV", Caters: "Caters",
  DogsAllowed: "Dogs allowed",
};
function featureChips(features) {
  if (!features) return "";
  const chips = [];
  for (const [k, label] of Object.entries(FEATURE_LABELS)) {
    if (features[k] === true) chips.push(label);
  }
  if (typeof features.WiFi === "string" && features.WiFi !== "no" && features.WiFi !== "none")
    chips.push(`WiFi (${features.WiFi.replace(/^u?'|'$/g, "")})`);
  if (typeof features.Alcohol === "string" && features.Alcohol !== "none")
    chips.push(features.Alcohol.replace(/^u?'|'$/g, "").replace(/_/g, " "));
  const parking = features.BusinessParking && Object.entries(features.BusinessParking)
    .filter(([, v]) => v === true).map(([k]) => k);
  if (parking && parking.length) chips.push("Parking: " + parking.join(", "));
  if (!chips.length) return `<span class="muted">No feature data.</span>`;
  return `<div class="chips">` + chips.map(c => `<span class="chip">${esc(c)}</span>`).join("") + `</div>`;
}
async function openDetail(restaurantId) {
  document.getElementById("detail-modal").classList.add("show");
  const body = document.getElementById("detail-body");
  let r = state.detailCache[restaurantId];
  if (!r || !r.attributes) {
    body.innerHTML = `<p class="muted">Loading…</p>`;
    try { r = await api("GET", `/restaurants/${restaurantId}`); state.detailCache[restaurantId] = r; }
    catch (e) { body.innerHTML = `<p class="muted">Couldn't load details: ${esc(e.message)}</p>`; return; }
  }
  renderDetail(r);
}
function renderDetail(r) {
  const body = document.getElementById("detail-body");
  const attrs = r.attributes || {};
  const badges = badgeHtml(r.id);
  const vline = visitLine(r.id);
  // Google Maps link. Search by name + address, but biased to the exact coords
  // via the /@lat,lng,zoom suffix: a listed restaurant opens straight to its
  // business card (photos, hours, reviews), and an unlisted one (e.g. a food
  // truck) still centers on the right block instead of scattering across the
  // region — which a plain ?query=name,address does. Coordinates are [lng, lat].
  const coords = r.location && r.location.coordinates;
  const label = [r.name, r.address].filter(Boolean).join(", ");
  let mapsHref = "";
  if (label && coords) {
    mapsHref = `https://www.google.com/maps/search/${encodeURIComponent(label)}/@${coords[1]},${coords[0]},16z`;
  } else if (label) {
    mapsHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(label)}`;
  } else if (coords) {
    mapsHref = `https://www.google.com/maps/search/?api=1&query=${coords[1]},${coords[0]}`;
  }
  const mapLink = mapsHref
    ? `<a href="${mapsHref}" target="_blank" rel="noopener">Open in Maps ↗</a>`
    : "";
  body.innerHTML =
    `<h3>${esc(r.name)} ${badges}</h3>` +
    `<div class="detail-sub">${price(r.price_level)} · ★${r.rating ?? "—"} (${r.rating_count ?? 0} reviews)` +
      `${vline ? " · " + vline : ""}</div>` +
    `<div class="detail-scroll">` +
      (r.address ? `<div class="detail-sec"><h4>Address</h4><div class="kv">${esc(r.address)} ${mapLink}</div></div>` : "") +
      (r.categories && r.categories.length
        ? `<div class="detail-sec"><h4>Cuisine</h4><div class="chips">` +
          r.categories.map(c => `<span class="chip">${esc(c)}</span>`).join("") + `</div></div>` : "") +
      `<div class="detail-sec"><h4>Hours</h4>${hoursHtml(attrs.hours)}</div>` +
      `<div class="detail-sec"><h4>Features</h4>${featureChips(attrs.features)}</div>` +
      `<div class="detail-sec"><h4>Your visits</h4>${visitHistoryHtml(r.id)}</div>` +
    `</div>` +
    `<div class="modal-actions"></div>`;
  // Action buttons that mutate lists — reuse the shared controls.
  const acts = body.querySelector(".modal-actions");
  const wb = wantButton(r.id, r.name);
  if (wb) acts.appendChild(wb);
  const visit = document.createElement("button");
  visit.textContent = (state.visitsByRestaurant[r.id] || []).length ? "Log another visit" : "Log visit";
  visit.onclick = () => { closeDetail(); openVisit(r.id, r.name); };
  acts.appendChild(visit);
  const picker = listPickerControl(r.id);
  if (picker) acts.appendChild(picker);
  // Wire per-visit Edit/Delete controls in the visit-history section (rendered
  // via innerHTML, so attach handlers after the fact).
  body.querySelectorAll("[data-vedit]").forEach(b => {
    b.onclick = () => {
      const v = (state.visitsByRestaurant[r.id] || []).find(x => x.id === b.getAttribute("data-vedit"));
      if (v) { closeDetail(); openVisit(r.id, r.name, v, true); }
    };
  });
  body.querySelectorAll("[data-vdel]").forEach(b => {
    b.onclick = () => deleteVisit(b.getAttribute("data-vdel"), r.id);
  });
}
function closeDetail() { document.getElementById("detail-modal").classList.remove("show"); }

// ---- Router ----
function render() {
  if (!state.token || !state.me) { renderAuthGate(); return; }
  const hash = location.hash || "#/lookup";
  state.route = hash.startsWith("#/lists") ? "lists"

  else if (state.route === "recommend") renderRecommend();
  else renderLookup();
}

// ---- Lookup page ----
// A curated set of common cuisines for the advanced-filters picker (all present

  };

  const liveSearch = debounce(searchRestaurants, 300);

// Toggle a value in an array in place (add if absent, remove if present).
function toggleInArray(arr, v) {
  const i = arr.indexOf(v);
  if (i === -1) arr.push(v); else arr.splice(i, 1);
}

function badgeHtml(restaurantId) {
  const types = state.savedIn[restaurantId];
  if (!types) return "";
  if (types.has("visited")) return `<span class="badge visited">visited</span>`;
  if (types.has("want_to_try")) return `<span class="badge saved">want to try</span>`;
  return "";
}
async function searchRestaurants() {
  const s = state.search;
  s.q = (document.getElementById("s-q") || {}).value ? document.getElementById("s-q").value.trim() : "";
  const params = new URLSearchParams();
  if (s.q) params.set("q", s.q);
  for (const c of s.cuisine) params.append("cuisine", c);   // OR'd server-side
  for (const p of s.price) params.append("price", p);       // exact levels
  if (s.rating) params.set("rating_min", s.rating);
  // Hours is filtered client-side (needs the user's local time + the hours JSON),
  // so fetch a deeper page when it's active to survive the post-filter.
  const hoursActive = s.hours && s.hours !== "any";
  params.set("limit", hoursActive ? "60" : "25");
  // Sequence guard: with live (debounced) search, a slower earlier request must
  // not overwrite a newer one's results if it lands late.
  const seq = (state.searchSeq = (state.searchSeq || 0) + 1);
  try {
    let results = await api("GET", "/restaurants?" + params.toString());
    if (seq !== state.searchSeq) return;   // superseded by a newer search
    if (hoursActive) {
      results = results.filter(r => {
        const hrs = (r.attributes || {}).hours;
        return s.hours === "open_24h" ? is24hWeek(hrs) : isOpenNow(hrs);
      });
    }
    state.results = results; renderResults();
  } catch (e) { if (seq === state.searchSeq) toast("Search failed: " + e.message, true); }
}

// ---- Hours evaluation (client-side; mirrors YELP_SEED_HOURS semantics) --------
const _toMins = t => { const [h, m] = String(t).split(":"); return parseInt(h, 10) * 60 + parseInt(m || "0", 10); };
function is24hWeek(hours) {   // YELP_SEED_HOURS: every listed day 0:0-0:0 => open 24h
  if (!hours) return false;
  const vals = Object.values(hours);
  return vals.length >= 6 && vals.every(v => v === _ZERO_SPAN);
}
// Is a "start-end" span open at `mins` minutes-past-midnight? A 0:0-0:0 span is a
// closed day (unless the whole week is 0:0-0:0 — handled by is24hWeek). Spans that
// wrap past midnight (end<=start, e.g. 17:0-2:0) are open from start until midnight.
function _spanOpenAt(span, mins) {
  if (!span || span === _ZERO_SPAN) return false;
  const [a, b] = span.split("-");
  const start = _toMins(a), end = _toMins(b);
  if (isNaN(start) || isNaN(end)) return false;
  return end > start ? (mins >= start && mins < end) : (mins >= start);
}
function isOpenNow(hours) {
  if (!hours) return false;
  if (is24hWeek(hours)) return true;
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  if (_spanOpenAt(hours[DAYS[now.getDay()]], mins)) return true;
  // A past-midnight span belongs to yesterday (e.g. yesterday 17:0-2:0 keeps a
  // place open until 2am today): open if now is before that span's end.
  const ySpan = hours[DAYS[(now.getDay() + 6) % 7]];
  if (ySpan && ySpan !== _ZERO_SPAN) {
    const [a, b] = ySpan.split("-");
    if (_toMins(b) <= _toMins(a) && mins < _toMins(b)) return true;
  }
  return false;
}

async function runRecommend() {
  const query = document.getElementById("r-query").value.trim();
  if (!query) return toast("Describe what you're looking for", true);
  const near = document.getElementById("r-near").value.trim();
  const priceMax = document.getElementById("r-price").value;
  const cuisineRaw = document.getElementById("r-cuisine").value.trim();
  const party = parseInt(document.getElementById("r-party").value, 10) || 2;
  const openNow = document.getElementById("r-open").checked;
  state.recommend = { ...state.recommend, query, near, price: priceMax, cuisine: cuisineRaw, party, openNow };
  const body = { query, party_size: party };
  if (near) body.near = near;
  if (priceMax) body.price_max = Number(priceMax);
  if (cuisineRaw) body.cuisine = cuisineRaw.split(",").map(s => s.trim()).filter(Boolean);
  if (openNow) body.open_now = true;

  const btn = document.getElementById("r-go");
  btn.disabled = true; btn.textContent = "Thinking…";
  const el = document.getElementById("rec-results");
  el.innerHTML = `<p class="muted">Retrieving and ranking candidates…</p>`;
  try {
    state.recommend.result = await api("POST", "/recommendations", body);
    renderRecResults();
  } catch (e) {
    state.recommend.result = null;
    el.innerHTML = `<p class="muted">Couldn't get recommendations: ${esc(humanizeAuthError(e.message))}</p>`;
  } finally {
    if (btn.isConnected) { btn.disabled = false; btn.textContent = "Get recommendations"; }
  }
}

    if (p.reasons && p.reasons.length) {

// Sort a list's items by the chosen key. Names/prices/ratings come off the joined
// restaurant record; "tag" groups by first tag so tagged items cluster together.
function sortItems(items) {
  const rname = it => ((it.restaurant && it.restaurant.name) || "").toLowerCase();
  const cmp = {
    added: (a, b) => new Date(b.added_at) - new Date(a.added_at),
    name: (a, b) => rname(a).localeCompare(rname(b)),
    price: (a, b) => ((a.restaurant && a.restaurant.price_level) || 99) - ((b.restaurant && b.restaurant.price_level) || 99),
    rating: (a, b) => ((b.restaurant && b.restaurant.rating) || 0) - ((a.restaurant && a.restaurant.rating) || 0),
    tag: (a, b) => {
      const ta = (a.tags && a.tags[0] || "￿").toLowerCase();
      const tb = (b.tags && b.tags[0] || "￿").toLowerCase();
      return ta.localeCompare(tb) || rname(a).localeCompare(rname(b));
    },
  }[state.itemSort] || (() => 0);
  return items.slice().sort(cmp);
}

      const ren = document.createElement("button"); ren.className = "tiny"; ren.textContent = "✎";
      ren.title = "Rename"; ren.onclick = e => { e.stopPropagation(); renameList(l); };
      const del = document.createElement("button"); del.className = "tiny"; del.textContent = "🗑";
      del.title = "Delete"; del.onclick = e => { e.stopPropagation(); deleteList(l); };
      row.append(ren, del);
    }
    el.appendChild(row);
  }
}
function selectedList() { return state.lists.find(l => l.id === state.selectedListId); }

async function renderItems() {
  const title = document.getElementById("items-title");
  const el = document.getElementById("items");
  if (!title || !el) return;
  const l = selectedList();
  if (!l) { title.textContent = "Items"; el.innerHTML = `<p class="muted">Select a list on the left.</p>`; return; }
  title.textContent = `${l.name}`;
  let items;
  try {
    items = await api("GET", `/lists/${l.id}/items`);
  } catch (e) {
    el.innerHTML = `<p class="muted">Couldn't load items: ${esc(e.message)}</p>`;
    const retry = document.createElement("button");
    retry.textContent = "Retry"; retry.onclick = renderItems;
    el.appendChild(retry);
    return;
  }
  const f = state.listFilter.trim().toLowerCase();
  if (f) items = items.filter(it => ((it.restaurant && it.restaurant.name) || "").toLowerCase().includes(f));
  if (!items.length) {
    el.innerHTML = `<p class="muted">${state.listFilter ? "No items match the filter." : "Empty. Add restaurants from Find Restaurants."}</p>`;
    return;
  }
  items = sortItems(items);
  el.innerHTML = "";
  for (const it of items) {
    const r = it.restaurant || {};
    if (r.id) state.detailCache[r.id] = r;
    const card = document.createElement("div");
    card.className = "card";

    const titleRow = document.createElement("div");
    titleRow.className = "row";
    const title = document.createElement("button");
    title.className = "link title grow";
    title.textContent = r.name || "";
    title.title = "View details";
    title.onclick = () => openDetail(it.restaurant_id);
    titleRow.appendChild(title);
    titleRow.insertAdjacentHTML("beforeend",
      `<span class="muted">${price(r.price_level)} · ★${r.rating ?? "—"}</span>`);
    card.appendChild(titleRow);

    let html = `<div class="meta">${esc((r.categories || []).join(", "))}</div>`;
    if (it.note) html += `<div class="note">“${esc(it.note)}”</div>`;
    if (it.tags && it.tags.length) html += `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    const vline = visitLine(it.restaurant_id);
    if (vline) html += `<div class="visits">${vline}</div>`;
    card.insertAdjacentHTML("beforeend", html);

    const actions = document.createElement("div");
    actions.className = "actions";
    const custom = listPickerControl(it.restaurant_id);
    if (custom) actions.appendChild(custom);

    const edit = document.createElement("button"); edit.className = "tiny"; edit.textContent = "Edit note/tags";
    edit.onclick = () => editItem(l.id, it); actions.appendChild(edit);

    const visit = document.createElement("button"); visit.className = "tiny";
    visit.textContent = (state.visitsByRestaurant[it.restaurant_id] || []).length ? "Log another visit" : "Log visit";
    visit.onclick = () => openVisit(it.restaurant_id, r.name); actions.appendChild(visit);

    const rm = document.createElement("button"); rm.className = "tiny"; rm.textContent = "Remove";
    rm.onclick = () => removeItem(l.id, it.restaurant_id); actions.appendChild(rm);

    card.appendChild(actions);
    el.appendChild(card);
  }
}

    await loadCore(); render();
    toast("Created “" + name + "”");
  } catch (e) { err.textContent = humanizeAuthError(e.message); }
}
async function renameList(l) {
  const name = prompt("Rename list:", l.name);
  if (name == null || !name.trim() || name === l.name) return;
  try { await api("PATCH", `/lists/${l.id}`, { name: name.trim() }); await loadCore(); render(); toast("Renamed"); }
  catch (e) { toast("Rename failed: " + e.message, true); }
}
async function deleteList(l) {
  if (!confirm(`Delete list “${l.name}”? Items in it are removed.`)) return;
  try {
    await api("DELETE", `/lists/${l.id}`);
    if (state.selectedListId === l.id) state.selectedListId = null;
    await loadCore(); render(); toast("Deleted");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}
// Edit note & tags via a proper modal (replaces the old prompt() dialogs). Note
// and tags are shared per-restaurant, so this write-through updates them wherever
// the restaurant appears.
function editItem(listId, it) {
  state.pendingNote = { listId, restaurantId: it.restaurant_id };
  const r = it.restaurant || {};
  document.getElementById("note-modal-sub").textContent = r.name || "";
  document.getElementById("n-note").value = it.note || "";
  document.getElementById("n-tags").value = (it.tags || []).join(", ");
  document.getElementById("note-modal").classList.add("show");
  document.getElementById("n-note").focus();
}
function closeNote() {
  state.pendingNote = null;
  document.getElementById("note-modal").classList.remove("show");
}
async function submitNote() {
  if (!state.pendingNote) return;
  const { listId, restaurantId } = state.pendingNote;
  const note = document.getElementById("n-note").value.trim();
  const tags = document.getElementById("n-tags").value.split(",").map(t => t.trim()).filter(Boolean);
  try {
    await api("PATCH", `/lists/${listId}/items/${restaurantId}`, { note: note || null, tags });
    closeNote();
    renderItems();
    toast("Note & tags saved");
  } catch (e) { toast("Save failed: " + e.message, true); }
}
async function removeItem(listId, restaurantId) {
  try { await api("DELETE", `/lists/${listId}/items/${restaurantId}`); await loadCore(); render(); toast("Removed"); }
  catch (e) { toast("Remove failed: " + e.message, true); }
}

// ---- Modal UX: click backdrop or press Escape to close ----
const MODAL_CLOSERS = {
  "visit-modal": closeVisit,
  "detail-modal": closeDetail,
  "note-modal": closeNote,
  "list-modal": closeListModal,
};
for (const [id, close] of Object.entries(MODAL_CLOSERS)) {
  const el = document.getElementById(id);
  if (el) el.addEventListener("click", e => { if (e.target.id === id) close(); });
}
// Close any open add-to-list picker when clicking outside it (native <details>
// only toggles on its own summary, so it wouldn't dismiss on an outside click).
function closeOpenPickers() {
  document.querySelectorAll("details.listpick[open]").forEach(d => (d.open = false));
}
document.addEventListener("click", e => {
  document.querySelectorAll("details.listpick[open]").forEach(d => {
    if (!d.contains(e.target)) d.open = false;
  });
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  closeVisit(); closeDetail(); closeNote(); closeListModal(); closeOpenPickers();
});
// Enter submits the create-list modal (its input lives in static markup).
document.getElementById("cl-name").addEventListener("keydown", e => { if (e.key === "Enter") submitNewList(); });

// ---- Boot ----
async function boot() {
  if (!state.token) { renderAuthGate(); return; }
  try {
    state.me = await api("GET", "/me");   // validate the stored token
  } catch (e) {
    clearSession(); renderAuthGate(); return;   // expired/invalid -> log in again
  }
  setChrome(true);
  document.getElementById("user-label").textContent =
    state.me.display_name || state.me.email || state.me.id.slice(0, 8);
  await loadCore();
  await loadCuisines();
  render();
}
boot();
</script>
