<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Lists — Dev Harness</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --line: #e3e3e8; --ink: #1d1d1f;
    --muted: #6b6b73; --accent: #c0392b; --accent-ink: #fff; --ok: #1f8a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; }
  header .who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  header input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  main { display: grid; grid-template-columns: 260px 1fr; gap: 16px; padding: 16px 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #f0f0f2; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.tiny { padding: 2px 7px; font-size: 12px; }
  input, select, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
  .list-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .list-row:hover { background: #f0f0f2; }
  .list-row.active { background: #fbeae7; }
  .list-row .name { flex: 1; font-weight: 600; }
  .list-row .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 6px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .card .title { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .tags { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .note { color: var(--ink); font-size: 13px; margin-top: 4px; font-style: italic; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; max-width: 80vw;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--accent); }
  .search-filters { display: grid; grid-template-columns: 1fr 130px 110px auto; gap: 8px; margin-bottom: 12px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } .search-filters { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🍽️ Restaurant Lists <span class="muted">— dev harness</span></h1>
  <div class="who">
    <span id="user-label">…</span>
    <label>X-User-Id <input id="user-id" placeholder="(default dev user)" size="14" /></label>
    <button class="tiny" onclick="applyUser()">Switch</button>
  </div>
</header>

<main>
  <!-- Lists sidebar -->
  <div class="col">
    <div class="panel">
      <h2>Lists</h2>
      <div id="lists"></div>
      <div class="row" style="margin-top:10px">
        <input id="new-list-name" class="grow" placeholder="New list name" />
        <button class="primary" onclick="createList()">＋</button>
      </div>
    </div>
  </div>

  <!-- Right column: search + selected list -->
  <div class="col">
    <div class="panel">
      <h2>Find restaurants (Philadelphia seed)</h2>
      <div class="search-filters">
        <input id="s-q" placeholder="Name contains…" onkeydown="if(event.key==='Enter')searchRestaurants()" />
        <input id="s-cuisine" placeholder="Cuisine" />
        <select id="s-price">
          <option value="">Any price</option>
          <option value="1">$</option><option value="2">$$</option>
          <option value="3">$$$</option><option value="4">$$$$</option>
        </select>
        <button class="primary" onclick="searchRestaurants()">Search</button>
      </div>
      <div id="search-results"><p class="muted">Search to find restaurants to add.</p></div>
    </div>

    <div class="panel">
      <h2 id="items-title">Items</h2>
      <div id="items"><p class="muted">Select a list on the left.</p></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";
const state = { lists: [], selectedId: null, userId: "" };

// ---- API helper (same-origin; optional X-User-Id header) ----
async function api(method, path, body) {
  const headers = {};
  if (state.userId) headers["X-User-Id"] = state.userId;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);
  return data;
}

function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 2600);
}
const price = n => (n ? "$".repeat(n) : "—");
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- User switching ----
function applyUser() {
  state.userId = document.getElementById("user-id").value.trim();
  state.selectedId = null;
  refresh();
}
async function loadUser() {
  try { const u = await api("GET", "/me"); document.getElementById("user-label").textContent = u.display_name || u.id.slice(0, 8); }
  catch (e) { toast("Load user failed: " + e.message, true); }
}

// ---- Lists ----
async function refresh() { await loadUser(); await loadLists(); await loadItems(); }

async function loadLists() {
  state.lists = await api("GET", "/lists");
  if (!state.selectedId && state.lists.length) {
    const want = state.lists.find(l => l.type === "want_to_try");
    state.selectedId = (want || state.lists[0]).id;
  }
  const el = document.getElementById("lists");
  el.innerHTML = "";
  for (const l of state.lists) {
    const core = l.type === "want_to_try" || l.type === "visited";
    const row = document.createElement("div");
    row.className = "list-row" + (l.id === state.selectedId ? " active" : "");
    row.onclick = () => { state.selectedId = l.id; loadLists(); loadItems(); };
    row.innerHTML =
      `<span class="name">${esc(l.name)}</span>` +
      (core ? `<span class="badge">core</span>` : "") +
      `<span class="count">${l.item_count ?? 0}</span>`;
    if (!core) {
      const ren = document.createElement("button"); ren.className = "tiny"; ren.textContent = "✎";
      ren.title = "Rename"; ren.onclick = e => { e.stopPropagation(); renameList(l); };
      const del = document.createElement("button"); del.className = "tiny"; del.textContent = "🗑";
      del.title = "Delete"; del.onclick = e => { e.stopPropagation(); deleteList(l); };
      row.append(ren, del);
    }
    el.appendChild(row);
  }
}

async function createList() {
  const inp = document.getElementById("new-list-name");
  const name = inp.value.trim();
  if (!name) return toast("Enter a list name", true);
  try {
    const l = await api("POST", "/lists", { name, type: "custom" });
    inp.value = ""; state.selectedId = l.id; await loadLists(); await loadItems();
    toast("Created “" + name + "”");
  } catch (e) { toast("Create failed: " + e.message, true); }
}

async function renameList(l) {
  const name = prompt("Rename list:", l.name);
  if (name == null || !name.trim() || name === l.name) return;
  try { await api("PATCH", `/lists/${l.id}`, { name: name.trim() }); await loadLists(); toast("Renamed"); }
  catch (e) { toast("Rename failed: " + e.message, true); }
}

async function deleteList(l) {
  if (!confirm(`Delete list “${l.name}”? Items in it are removed.`)) return;
  try {
    await api("DELETE", `/lists/${l.id}`);
    if (state.selectedId === l.id) state.selectedId = null;
    await loadLists(); await loadItems(); toast("Deleted");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}

// ---- Restaurant search ----
async function searchRestaurants() {
  const q = document.getElementById("s-q").value.trim();
  const cuisine = document.getElementById("s-cuisine").value.trim();
  const priceMax = document.getElementById("s-price").value;
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (cuisine) params.set("cuisine", cuisine);
  if (priceMax) params.set("price_max", priceMax);
  params.set("limit", "25");
  const el = document.getElementById("search-results");
  try {
    const rows = await api("GET", "/restaurants?" + params.toString());
    if (!rows.length) { el.innerHTML = `<p class="muted">No matches.</p>`; return; }
    el.innerHTML = "";
    for (const r of rows) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        `<div class="row"><span class="title grow">${esc(r.name)}</span>` +
        `<span class="muted">${price(r.price_level)} · ★${r.rating ?? "—"} (${r.rating_count ?? 0})</span></div>` +
        `<div class="meta">${esc((r.categories || []).join(", "))}</div>`;
      const add = document.createElement("button");
      add.className = "primary tiny"; add.textContent = "Add to selected list";
      add.onclick = () => addItem(r.id, r.name);
      const wrap = document.createElement("div"); wrap.className = "actions"; wrap.appendChild(add);
      card.appendChild(wrap);
      el.appendChild(card);
    }
  } catch (e) { toast("Search failed: " + e.message, true); }
}

async function addItem(restaurantId, name) {
  if (!state.selectedId) return toast("Select a list first", true);
  try {
    await api("POST", `/lists/${state.selectedId}/items`, { restaurant_id: restaurantId });
    await loadLists(); await loadItems();
    toast(`Added “${name}”`);
  } catch (e) { toast("Add failed: " + e.message, true); }
}

// ---- Selected list items ----
function selectedList() { return state.lists.find(l => l.id === state.selectedId); }

async function loadItems() {
  const title = document.getElementById("items-title");
  const el = document.getElementById("items");
  const l = selectedList();
  if (!l) { title.textContent = "Items"; el.innerHTML = `<p class="muted">Select a list on the left.</p>`; return; }
  title.textContent = `${l.name} — items`;
  const items = await api("GET", `/lists/${l.id}/items`);
  if (!items.length) { el.innerHTML = `<p class="muted">Empty. Add restaurants from the search above.</p>`; return; }
  el.innerHTML = "";
  const others = state.lists.filter(x => x.id !== l.id);
  for (const it of items) {
    const r = it.restaurant || {};
    const card = document.createElement("div");
    card.className = "card";
    let html =
      `<div class="row"><span class="title grow">${esc(r.name)}</span>` +
      `<span class="muted">${price(r.price_level)} · ★${r.rating ?? "—"}</span></div>` +
      `<div class="meta">${esc((r.categories || []).join(", "))}</div>`;
    if (it.note) html += `<div class="note">“${esc(it.note)}”</div>`;
    if (it.tags && it.tags.length) html += `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    card.innerHTML = html;

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button"); edit.className = "tiny"; edit.textContent = "Edit note/tags";
    edit.onclick = () => editItem(l.id, it);
    actions.appendChild(edit);

    if (others.length) {
      const sel = document.createElement("select");
      sel.innerHTML = `<option value="">Move to…</option>` +
        others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join("");
      sel.onchange = () => { if (sel.value) moveItem(l.id, r.id, sel.value); };
      actions.appendChild(sel);
    }

    const visit = document.createElement("button"); visit.className = "tiny"; visit.textContent = "Mark visited";
    visit.onclick = () => recordVisit(r.id, r.name);
    actions.appendChild(visit);

    const rm = document.createElement("button"); rm.className = "tiny"; rm.textContent = "Remove";
    rm.onclick = () => removeItem(l.id, r.id);
    actions.appendChild(rm);

    card.appendChild(actions);
    el.appendChild(card);
  }
}

async function editItem(listId, it) {
  const note = prompt("Note:", it.note || "");
  if (note == null) return;
  const tagsRaw = prompt("Tags (comma-separated):", (it.tags || []).join(", "));
  if (tagsRaw == null) return;
  const tags = tagsRaw.split(",").map(t => t.trim()).filter(Boolean);
  try {
    await api("PATCH", `/lists/${listId}/items/${it.restaurant_id}`, { note, tags });
    await loadItems(); toast("Updated");
  } catch (e) { toast("Update failed: " + e.message, true); }
}

async function moveItem(fromId, restaurantId, toId) {
  try {
    await api("POST", `/lists/${fromId}/items/${restaurantId}/move`, { to_list_id: toId });
    await loadLists(); await loadItems(); toast("Moved");
  } catch (e) { toast("Move failed: " + e.message, true); }
}

async function removeItem(listId, restaurantId) {
  try { await api("DELETE", `/lists/${listId}/items/${restaurantId}`); await loadLists(); await loadItems(); toast("Removed"); }
  catch (e) { toast("Remove failed: " + e.message, true); }
}

async function recordVisit(restaurantId, name) {
  const sentiment = prompt("Sentiment — loved / liked / wouldnt_return (blank to skip):", "loved");
  if (sentiment == null) return;
  const body = { restaurant_id: restaurantId };
  if (sentiment.trim()) body.sentiment = sentiment.trim();
  try {
    await api("POST", "/visits", body);
    await loadLists(); await loadItems();
    toast(`Recorded visit to “${name}” (moved to Visited)`);
  } catch (e) { toast("Visit failed: " + e.message, true); }
}

refresh();
</script>
</body>
</html>
