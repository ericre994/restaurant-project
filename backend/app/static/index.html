<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Lists — Dev Harness</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #fff; --line: #e3e3e8; --ink: #1d1d1f;
    --muted: #6b6b73; --accent: #c0392b; --accent-ink: #fff; --ok: #1f8a4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  header {
    display: flex; align-items: center; gap: 18px; padding: 10px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 4px; }
  nav a {
    text-decoration: none; color: var(--muted); font-weight: 600; padding: 6px 12px;
    border-radius: 7px; font-size: 14px;
  }
  nav a:hover { background: #f0f0f2; }
  nav a.active { background: #fbeae7; color: var(--accent); }
  header .who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  header input { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  main { padding: 16px 20px; }
  .two-col { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #f0f0f2; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.tiny { padding: 2px 7px; font-size: 12px; }
  button.want { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  button.want:hover { background: #e7f6ec; }
  button.want.saved { background: var(--ok); color: #fff; border-color: var(--ok); }
  button.want.saved:hover { filter: brightness(1.06); background: var(--ok); }
  button.link { border: none; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; }
  button.link:hover { background: none; text-decoration: underline; }
  input, select, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; }
  select.addto { max-width: 150px; }
  .list-row { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
  .list-row:hover { background: #f0f0f2; }
  .list-row.active { background: #fbeae7; }
  .list-row .name { flex: 1; font-weight: 600; }
  .list-row .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 11px; background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 6px; }
  .badge.saved { background: #e7f6ec; color: var(--ok); }
  .badge.visited { background: #efe7f6; color: #6a3a8a; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .card .title { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .card .tags { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { background: #eef; color: #3a3a8a; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); }
  .note { color: var(--ink); font-size: 13px; margin-top: 4px; font-style: italic; }
  .visits { color: var(--ok); font-size: 12px; margin-top: 4px; }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 8px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 80vw;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--accent); }
  .search-filters { display: grid; grid-template-columns: 1fr 130px 110px auto; gap: 8px; margin-bottom: 12px; }
  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  .modal-backdrop.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 380px; max-width: 92vw; }
  .modal.wide { width: 520px; }
  .modal h3 { margin: 0 0 4px; }
  .modal .field { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .modal .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal .close-x { float: right; border: none; background: none; font-size: 20px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0; }
  .modal .close-x:hover { color: var(--ink); background: none; }
  /* Detail view */
  .detail-sub { color: var(--muted); margin: 2px 0 12px; }
  .detail-sec { margin-top: 14px; }
  .detail-sec h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .hours-grid { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: 13px; }
  .hours-grid .day { color: var(--muted); }
  .hours-grid .today { font-weight: 700; color: var(--ink); }
  .hours-grid .today .day, .hours-grid .today.day { color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #eef; color: #3a3a8a; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .kv { font-size: 13px; }
  .kv b { font-weight: 600; }
  .detail-scroll { max-height: 62vh; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
  @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } .search-filters { grid-template-columns: 1fr; } .modal.wide { width: 92vw; } }
</style>
</head>
<body>
<header>
  <h1>🍽️ Restaurant Lists</h1>
  <nav>
    <a href="#/lookup" id="nav-lookup">Find Restaurants</a>
    <a href="#/lists" id="nav-lists">My Lists</a>
  </nav>
  <div class="who">
    <span id="user-label">…</span>
    <label>X-User-Id <input id="user-id" placeholder="(default dev user)" size="14" /></label>
    <button class="tiny" onclick="applyUser()">Switch</button>
  </div>
</header>

<main id="content"></main>

<!-- Log-visit modal -->
<div class="modal-backdrop" id="visit-modal">
  <div class="modal">
    <h3>Log a visit</h3>
    <div class="muted" id="visit-modal-sub"></div>
    <div class="field">
      <label>Sentiment</label>
      <select id="v-sentiment">
        <option value="">— none —</option>
        <option value="loved">Loved it</option>
        <option value="liked">Liked it</option>
        <option value="wouldnt_return">Wouldn't return</option>
      </select>
    </div>
    <div class="field">
      <label>Rating (1–5)</label>
      <select id="v-rating">
        <option value="">— none —</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
      </select>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="v-date" />
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="v-notes" rows="2" placeholder="What did you have? Who with?"></textarea>
    </div>
    <div class="modal-actions">
      <button onclick="closeVisit()">Cancel</button>
      <button class="primary" onclick="submitVisit()">Log visit</button>
    </div>
  </div>
</div>

<!-- Restaurant detail modal -->
<div class="modal-backdrop" id="detail-modal">
  <div class="modal wide">
    <button class="close-x" onclick="closeDetail()" title="Close">×</button>
    <div id="detail-body"></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const state = {
  lists: [], userId: "", route: "lookup",
  selectedListId: null, results: null, listFilter: "",
  visitsByRestaurant: {},   // restaurant_id -> [visits]
  savedIn: {},              // restaurant_id -> Set(list types) for badges on lookup
  pendingVisit: null,       // {restaurantId, name}
  cuisines: [],             // [{name, count}] for the search-bar typeahead
  itemSort: "added",        // My Lists sort key: added|name|price|rating|tag
  detailCache: {},          // restaurant_id -> full restaurant record (with attributes)
  search: { q: "", cuisine: "", price: "" },  // persisted so a re-render (e.g. after a save) keeps the query
};

// ---- API helper (same-origin; optional X-User-Id header) ----
// Retries transient network errors ("Failed to fetch"): uvicorn's dev server on
// Windows occasionally resets a keep-alive connection, which surfaces as a
// rejected fetch even though the request is valid. HTTP errors (4xx/5xx) are
// real and are NOT retried.
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function api(method, path, body, _attempt = 0) {
  const headers = {};
  if (state.userId) headers["X-User-Id"] = state.userId;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (netErr) {
    if (_attempt < 3) { await sleep(120 * (_attempt + 1)); return api(method, path, body, _attempt + 1); }
    throw new Error("Network error — is the server running? (" + netErr.message + ")");
  }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);
  return data;
}
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), 2600);
}
const price = n => (n ? "$".repeat(n) : "—");
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CORE = { want_to_try: "Want to Try", visited: "Visited" };

// ---- User switching ----
function applyUser() {
  state.userId = document.getElementById("user-id").value.trim();
  state.selectedId = null; state.results = null;
  boot();
}
async function loadUser() {
  try { const u = await api("GET", "/me"); document.getElementById("user-label").textContent = u.display_name || u.id.slice(0, 8); }
  catch (e) { toast("Load user failed: " + e.message, true); }
}

// ---- Shared data load ----
async function loadCore() {
  state.lists = await api("GET", "/lists");
  if (!state.selectedListId && state.lists.length) {
    const want = state.lists.find(l => l.type === "want_to_try");
    state.selectedListId = (want || state.lists[0]).id;
  }
  // Visit history (for counts) + a map of which core lists a restaurant is in.
  const visits = await api("GET", "/visits");
  const vmap = {};
  for (const v of visits) (vmap[v.restaurant_id] = vmap[v.restaurant_id] || []).push(v);
  state.visitsByRestaurant = vmap;

  const saved = {};
  for (const l of state.lists.filter(x => x.type === "want_to_try" || x.type === "visited")) {
    const items = await api("GET", `/lists/${l.id}/items`);
    for (const it of items) (saved[it.restaurant_id] = saved[it.restaurant_id] || new Set()).add(l.type);
  }
  state.savedIn = saved;
}

// ---- Add-to custom list (core lists have dedicated Want-to-Try / Log-visit buttons) ----
async function addToList(restaurantId, listId) {
  const l = state.lists.find(x => x.id === listId);
  try {
    await api("POST", `/lists/${listId}/items`, { restaurant_id: restaurantId });
    await loadCore();
    render();
    toast(`Added to “${l ? l.name : "list"}”`);
  } catch (e) {
    if (String(e.message).includes("already in this list")) toast("Already in that list");
    else toast("Add failed: " + e.message, true);
  }
}

// ---- Visit modal ----
// Local (not UTC) YYYY-MM-DD for today, used as the date picker's max so future
// visits can't be selected. The server enforces this too (POST /visits 422s).
function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function openVisit(restaurantId, name) {
  state.pendingVisit = { restaurantId, name };
  document.getElementById("visit-modal-sub").textContent = name;
  document.getElementById("v-sentiment").value = "";
  document.getElementById("v-rating").value = "";
  document.getElementById("v-notes").value = "";
  const dateEl = document.getElementById("v-date");
  dateEl.value = "";
  dateEl.max = todayLocalISO();   // no future dates in the picker
  document.getElementById("visit-modal").classList.add("show");
}
function closeVisit() {
  state.pendingVisit = null;
  document.getElementById("visit-modal").classList.remove("show");
}
async function submitVisit() {
  if (!state.pendingVisit) return;
  const body = { restaurant_id: state.pendingVisit.restaurantId };
  const s = document.getElementById("v-sentiment").value;
  const r = document.getElementById("v-rating").value;
  const notes = document.getElementById("v-notes").value.trim();
  const date = document.getElementById("v-date").value;
  if (s) body.sentiment = s;
  if (r) body.user_rating = Number(r);
  if (notes) body.notes = notes;
  if (date) {
    if (date > todayLocalISO()) return toast("Visit date can't be in the future", true);
    body.visited_at = new Date(date + "T12:00:00").toISOString();
  }
  const name = state.pendingVisit.name;
  try {
    await api("POST", "/visits", body);
    closeVisit();
    await loadCore();
    render();
    toast(`Logged a visit to “${name}” (now in Visited)`);
  } catch (e) { toast("Log visit failed: " + e.message, true); }
}
function visitLine(restaurantId) {
  const vs = state.visitsByRestaurant[restaurantId] || [];
  if (!vs.length) return "";
  const last = vs[0].visited_at ? new Date(vs[0].visited_at).toLocaleDateString() : "";
  return `Visited ${vs.length}× ${last ? "· last " + last : ""}`;
}

// ---- Core-list helpers ----
const coreListId = type => (state.lists.find(l => l.type === type) || {}).id;
const isSavedIn = (restaurantId, type) => (state.savedIn[restaurantId] || new Set()).has(type);

// Want-to-Try toggle: one-click save, click again to unsave. Clearer than the
// old catch-all "Add to…" dropdown that mixed core lists with custom ones.
async function toggleWantToTry(restaurantId, name) {
  const listId = coreListId("want_to_try");
  if (!listId) return toast("No Want-to-Try list", true);
  try {
    if (isSavedIn(restaurantId, "want_to_try")) {
      await api("DELETE", `/lists/${listId}/items/${restaurantId}`);
      await loadCore(); render(); toast(`Removed “${name}” from Want to Try`);
    } else {
      await api("POST", `/lists/${listId}/items`, { restaurant_id: restaurantId });
      await loadCore(); render(); toast(`Saved “${name}” to Want to Try`);
    }
  } catch (e) {
    if (String(e.message).includes("already in this list")) { await loadCore(); render(); }
    else toast("Failed: " + e.message, true);
  }
}
function wantButton(restaurantId, name) {
  const saved = isSavedIn(restaurantId, "want_to_try");
  const b = document.createElement("button");
  b.className = "want" + (saved ? " saved" : "");
  b.textContent = saved ? "✓ Want to Try" : "＋ Want to Try";
  b.title = saved ? "Remove from Want to Try" : "Save to Want to Try";
  b.onclick = () => toggleWantToTry(restaurantId, name);
  return b;
}
// Compact picker for CUSTOM lists only (core lists have dedicated buttons now).
function customListSelect(restaurantId) {
  const custom = state.lists.filter(l => l.type === "custom");
  if (!custom.length) return null;
  const sel = document.createElement("select");
  sel.className = "addto";
  sel.innerHTML = `<option value="">＋ Add to list…</option>` +
    custom.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
  sel.onchange = () => { if (sel.value) addToList(restaurantId, sel.value); sel.value = ""; };
  return sel;
}

// ---- Cuisine typeahead ----
async function loadCuisines() {
  try {
    if (!state.cuisines.length) state.cuisines = await api("GET", "/restaurants/cuisines?limit=60");
    const dl = document.getElementById("cuisine-options");
    if (dl) dl.innerHTML = state.cuisines
      .map(c => `<option value="${esc(c.name)}">${c.count} places</option>`).join("");
  } catch (e) { /* non-fatal: search still works without suggestions */ }
}

// ---- Restaurant detail view ----
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const _todayName = () => DAYS[new Date().getDay()];
function fmtTime(t) { // "7:0" / "20:30" -> "7:00 AM" / "8:30 PM"
  const [hRaw, mRaw] = String(t).split(":");
  let h = parseInt(hRaw, 10); const m = (mRaw || "0").padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
}
function hoursHtml(hours) {
  if (!hours || !Object.keys(hours).length) return `<span class="muted">No hours on file.</span>`;
  const today = _todayName();
  return `<div class="hours-grid">` + DAYS.map(d => {
    const v = hours[d];
    const span = v ? v.split("-").map(fmtTime).join(" – ") : "Closed";
    const cls = d === today ? " today" : "";
    return `<div class="day${cls}">${d}</div><div class="${cls.trim()}">${esc(span)}</div>`;
  }).join("") + `</div>`;
}
// Human labels for the raw Yelp feature keys worth surfacing.
const FEATURE_LABELS = {
  RestaurantsTakeOut: "Takeout", RestaurantsDelivery: "Delivery",
  OutdoorSeating: "Outdoor seating", RestaurantsReservations: "Reservations",
  RestaurantsGoodForGroups: "Good for groups", GoodForKids: "Good for kids",
  BusinessAcceptsCreditCards: "Cards accepted", BikeParking: "Bike parking",
  WheelchairAccessible: "Wheelchair accessible", HasTV: "Has TV", Caters: "Caters",
  DogsAllowed: "Dogs allowed",
};
function featureChips(features) {
  if (!features) return "";
  const chips = [];
  for (const [k, label] of Object.entries(FEATURE_LABELS)) {
    if (features[k] === true) chips.push(label);
  }
  if (typeof features.WiFi === "string" && features.WiFi !== "no" && features.WiFi !== "none")
    chips.push(`WiFi (${features.WiFi.replace(/^u?'|'$/g, "")})`);
  if (typeof features.Alcohol === "string" && features.Alcohol !== "none")
    chips.push(features.Alcohol.replace(/^u?'|'$/g, "").replace(/_/g, " "));
  const parking = features.BusinessParking && Object.entries(features.BusinessParking)
    .filter(([, v]) => v === true).map(([k]) => k);
  if (parking && parking.length) chips.push("Parking: " + parking.join(", "));
  if (!chips.length) return `<span class="muted">No feature data.</span>`;
  return `<div class="chips">` + chips.map(c => `<span class="chip">${esc(c)}</span>`).join("") + `</div>`;
}
async function openDetail(restaurantId) {
  document.getElementById("detail-modal").classList.add("show");
  const body = document.getElementById("detail-body");
  let r = state.detailCache[restaurantId];
  if (!r || !r.attributes) {
    body.innerHTML = `<p class="muted">Loading…</p>`;
    try { r = await api("GET", `/restaurants/${restaurantId}`); state.detailCache[restaurantId] = r; }
    catch (e) { body.innerHTML = `<p class="muted">Couldn't load details: ${esc(e.message)}</p>`; return; }
  }
  renderDetail(r);
}
function renderDetail(r) {
  const body = document.getElementById("detail-body");
  const attrs = r.attributes || {};
  const badges = badgeHtml(r.id);
  const vline = visitLine(r.id);
  const coords = r.location && r.location.coordinates;
  const mapLink = coords
    ? `<a href="https://www.google.com/maps/search/?api=1&query=${coords[1]},${coords[0]}" target="_blank" rel="noopener">Open in Maps ↗</a>`
    : "";
  body.innerHTML =
    `<h3>${esc(r.name)} ${badges}</h3>` +
    `<div class="detail-sub">${price(r.price_level)} · ★${r.rating ?? "—"} (${r.rating_count ?? 0} reviews)` +
      `${vline ? " · " + vline : ""}</div>` +
    `<div class="detail-scroll">` +
      (r.address ? `<div class="detail-sec"><h4>Address</h4><div class="kv">${esc(r.address)} ${mapLink}</div></div>` : "") +
      (r.categories && r.categories.length
        ? `<div class="detail-sec"><h4>Cuisine</h4><div class="chips">` +
          r.categories.map(c => `<span class="chip">${esc(c)}</span>`).join("") + `</div></div>` : "") +
      `<div class="detail-sec"><h4>Hours</h4>${hoursHtml(attrs.hours)}</div>` +
      `<div class="detail-sec"><h4>Features</h4>${featureChips(attrs.features)}</div>` +
    `</div>` +
    `<div class="modal-actions"></div>`;
  // Action buttons that mutate lists — reuse the shared controls.
  const acts = body.querySelector(".modal-actions");
  acts.appendChild(wantButton(r.id, r.name));
  const visit = document.createElement("button");
  visit.textContent = (state.visitsByRestaurant[r.id] || []).length ? "Log another visit" : "Log visit";
  visit.onclick = () => { closeDetail(); openVisit(r.id, r.name); };
  acts.appendChild(visit);
}
function closeDetail() { document.getElementById("detail-modal").classList.remove("show"); }

// ---- Router ----
function render() {
  const hash = location.hash || "#/lookup";
  state.route = hash.startsWith("#/lists") ? "lists" : "lookup";
  document.getElementById("nav-lookup").classList.toggle("active", state.route === "lookup");
  document.getElementById("nav-lists").classList.toggle("active", state.route === "lists");
  if (state.route === "lists") renderLists();
  else renderLookup();
}
window.addEventListener("hashchange", render);

// ---- Lookup page ----
function renderLookup() {
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="panel">
      <h2>Find restaurants (Philadelphia seed)</h2>
      <div class="search-filters">
        <input id="s-q" placeholder="Name (typo-tolerant)…" value="${esc(state.search.q)}" />
        <input id="s-cuisine" list="cuisine-options" placeholder="Cuisine — type or pick…" autocomplete="off" value="${esc(state.search.cuisine)}" />
        <select id="s-price">
          <option value="">Any price</option>
          <option value="1">$</option><option value="2">$$</option>
          <option value="3">$$$</option><option value="4">$$$$</option>
        </select>
        <div class="row">
          <button class="primary" id="s-go">Search</button>
          <button id="s-clear" title="Clear search">Clear</button>
        </div>
      </div>
      <datalist id="cuisine-options"></datalist>
      <div id="search-results"></div>
    </div>`;
  document.getElementById("s-price").value = state.search.price;   // restore across re-renders
  document.getElementById("s-go").onclick = searchRestaurants;
  document.getElementById("s-clear").onclick = clearSearch;
  const onEnter = e => { if (e.key === "Enter") searchRestaurants(); };
  document.getElementById("s-q").addEventListener("keydown", onEnter);
  document.getElementById("s-cuisine").addEventListener("keydown", onEnter);
  // Picking a cuisine or price searches immediately (a filter should feel live,
  // not require a separate Search click).
  document.getElementById("s-cuisine").addEventListener("change", () => searchRestaurants());
  document.getElementById("s-price").addEventListener("change", () => searchRestaurants());
  loadCuisines();     // populate the datalist (cheap; cached in state after first call)
  renderResults();
}
function clearSearch() {
  document.getElementById("s-q").value = "";
  document.getElementById("s-cuisine").value = "";
  document.getElementById("s-price").value = "";
  state.search = { q: "", cuisine: "", price: "" };
  state.results = null;
  renderResults();
  document.getElementById("s-q").focus();
}
function renderResults() {
  const el = document.getElementById("search-results");
  if (!el) return;
  if (state.results === null) { el.innerHTML = `<p class="muted">Search to find restaurants to add to a list.</p>`; return; }
  if (!state.results.length) { el.innerHTML = `<p class="muted">No matches.</p>`; return; }
  el.innerHTML = "";
  for (const r of state.results) {
    state.detailCache[r.id] = r;   // search rows already carry attributes — reuse for the detail modal
    const card = document.createElement("div");
    card.className = "card";
    const badges = badgeHtml(r.id);
    const titleRow = document.createElement("div");
    titleRow.className = "row";
    const title = document.createElement("button");
    title.className = "link title grow";
    title.innerHTML = `${esc(r.name)} ${badges}`;
    title.title = "View details";
    title.onclick = () => openDetail(r.id);
    titleRow.appendChild(title);
    const meta = document.createElement("span");
    meta.className = "muted";
    meta.textContent = `${price(r.price_level)} · ★${r.rating ?? "—"} (${r.rating_count ?? 0})`;
    titleRow.appendChild(meta);
    card.appendChild(titleRow);
    card.insertAdjacentHTML("beforeend", `<div class="meta">${esc((r.categories || []).join(", "))}</div>`);
    const line = visitLine(r.id);
    if (line) card.insertAdjacentHTML("beforeend", `<div class="visits">${line}</div>`);

    const actions = document.createElement("div");
    actions.className = "actions";
    actions.appendChild(wantButton(r.id, r.name));
    const visit = document.createElement("button");
    visit.textContent = (state.visitsByRestaurant[r.id] || []).length ? "Log another visit" : "🍽 Log visit";
    visit.onclick = () => openVisit(r.id, r.name);
    actions.appendChild(visit);
    const custom = customListSelect(r.id);
    if (custom) actions.appendChild(custom);
    card.appendChild(actions);
    el.appendChild(card);
  }
}
function badgeHtml(restaurantId) {
  const types = state.savedIn[restaurantId];
  if (!types) return "";
  if (types.has("visited")) return `<span class="badge visited">visited</span>`;
  if (types.has("want_to_try")) return `<span class="badge saved">want to try</span>`;
  return "";
}
async function searchRestaurants() {
  const q = document.getElementById("s-q").value.trim();
  const cuisine = document.getElementById("s-cuisine").value.trim();
  const priceMax = document.getElementById("s-price").value;
  state.search = { q, cuisine, price: priceMax };   // persist so a later re-render keeps the query
  const params = new URLSearchParams();
  if (q) params.set("q", q);
  if (cuisine) params.set("cuisine", cuisine);
  if (priceMax) params.set("price_max", priceMax);
  params.set("limit", "25");
  try { state.results = await api("GET", "/restaurants?" + params.toString()); renderResults(); }
  catch (e) { toast("Search failed: " + e.message, true); }
}

// ---- Lists page ----
function renderLists() {
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="two-col">
      <div class="col">
        <div class="panel">
          <h2>Lists</h2>
          <div id="lists"></div>
          <div class="row" style="margin-top:10px">
            <input id="new-list-name" class="grow" placeholder="New list name" />
            <button class="primary" id="new-list-go">＋</button>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="panel">
          <div class="row"><h2 id="items-title" class="grow">Items</h2>
            <label class="muted" style="font-size:12px">Sort
              <select id="list-sort">
                <option value="added">Recently added</option>
                <option value="name">Name (A–Z)</option>
                <option value="price">Price (low→high)</option>
                <option value="rating">Rating (high→low)</option>
                <option value="tag">Tag</option>
              </select></label>
            <input id="list-filter" placeholder="Filter by name…" /></div>
          <div id="items"></div>
        </div>
      </div>
    </div>`;
  document.getElementById("new-list-go").onclick = createList;
  document.getElementById("new-list-name").addEventListener("keydown", e => { if (e.key === "Enter") createList(); });
  const f = document.getElementById("list-filter");
  f.value = state.listFilter;
  f.addEventListener("input", () => { state.listFilter = f.value; renderItems(); });
  const sortSel = document.getElementById("list-sort");
  sortSel.value = state.itemSort;
  sortSel.addEventListener("change", () => { state.itemSort = sortSel.value; renderItems(); });
  renderSidebar();
  renderItems();
}
// Sort a list's items by the chosen key. Names/prices/ratings come off the joined
// restaurant record; "tag" groups by first tag so tagged items cluster together.
function sortItems(items) {
  const rname = it => ((it.restaurant && it.restaurant.name) || "").toLowerCase();
  const cmp = {
    added: (a, b) => new Date(b.added_at) - new Date(a.added_at),
    name: (a, b) => rname(a).localeCompare(rname(b)),
    price: (a, b) => ((a.restaurant && a.restaurant.price_level) || 99) - ((b.restaurant && b.restaurant.price_level) || 99),
    rating: (a, b) => ((b.restaurant && b.restaurant.rating) || 0) - ((a.restaurant && a.restaurant.rating) || 0),
    tag: (a, b) => {
      const ta = (a.tags && a.tags[0] || "￿").toLowerCase();
      const tb = (b.tags && b.tags[0] || "￿").toLowerCase();
      return ta.localeCompare(tb) || rname(a).localeCompare(rname(b));
    },
  }[state.itemSort] || (() => 0);
  return items.slice().sort(cmp);
}
function renderSidebar() {
  const el = document.getElementById("lists");
  if (!el) return;
  el.innerHTML = "";
  for (const l of state.lists) {
    const core = l.type === "want_to_try" || l.type === "visited";
    const row = document.createElement("div");
    row.className = "list-row" + (l.id === state.selectedListId ? " active" : "");
    row.onclick = () => { state.selectedListId = l.id; renderSidebar(); renderItems(); };
    row.innerHTML =
      `<span class="name">${esc(l.name)}</span>` +
      (core ? `<span class="badge">core</span>` : "") +
      `<span class="count">${l.item_count ?? 0}</span>`;
    if (!core) {
      const ren = document.createElement("button"); ren.className = "tiny"; ren.textContent = "✎";
      ren.title = "Rename"; ren.onclick = e => { e.stopPropagation(); renameList(l); };
      const del = document.createElement("button"); del.className = "tiny"; del.textContent = "🗑";
      del.title = "Delete"; del.onclick = e => { e.stopPropagation(); deleteList(l); };
      row.append(ren, del);
    }
    el.appendChild(row);
  }
}
function selectedList() { return state.lists.find(l => l.id === state.selectedListId); }

async function renderItems() {
  const title = document.getElementById("items-title");
  const el = document.getElementById("items");
  if (!title || !el) return;
  const l = selectedList();
  if (!l) { title.textContent = "Items"; el.innerHTML = `<p class="muted">Select a list on the left.</p>`; return; }
  title.textContent = `${l.name}`;
  let items;
  try {
    items = await api("GET", `/lists/${l.id}/items`);
  } catch (e) {
    el.innerHTML = `<p class="muted">Couldn't load items: ${esc(e.message)}</p>`;
    const retry = document.createElement("button");
    retry.textContent = "Retry"; retry.onclick = renderItems;
    el.appendChild(retry);
    return;
  }
  const f = state.listFilter.trim().toLowerCase();
  if (f) items = items.filter(it => ((it.restaurant && it.restaurant.name) || "").toLowerCase().includes(f));
  if (!items.length) {
    el.innerHTML = `<p class="muted">${state.listFilter ? "No items match the filter." : "Empty. Add restaurants from Find Restaurants."}</p>`;
    return;
  }
  items = sortItems(items);
  el.innerHTML = "";
  for (const it of items) {
    const r = it.restaurant || {};
    if (r.id) state.detailCache[r.id] = r;
    const card = document.createElement("div");
    card.className = "card";

    const titleRow = document.createElement("div");
    titleRow.className = "row";
    const title = document.createElement("button");
    title.className = "link title grow";
    title.textContent = r.name || "";
    title.title = "View details";
    title.onclick = () => openDetail(it.restaurant_id);
    titleRow.appendChild(title);
    titleRow.insertAdjacentHTML("beforeend",
      `<span class="muted">${price(r.price_level)} · ★${r.rating ?? "—"}</span>`);
    card.appendChild(titleRow);

    let html = `<div class="meta">${esc((r.categories || []).join(", "))}</div>`;
    if (it.note) html += `<div class="note">“${esc(it.note)}”</div>`;
    if (it.tags && it.tags.length) html += `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`;
    const vline = visitLine(it.restaurant_id);
    if (vline) html += `<div class="visits">${vline}</div>`;
    card.insertAdjacentHTML("beforeend", html);

    const actions = document.createElement("div");
    actions.className = "actions";
    const custom = customListSelect(it.restaurant_id);
    if (custom) actions.appendChild(custom);

    const edit = document.createElement("button"); edit.className = "tiny"; edit.textContent = "Edit note/tags";
    edit.onclick = () => editItem(l.id, it); actions.appendChild(edit);

    const visit = document.createElement("button"); visit.className = "tiny";
    visit.textContent = (state.visitsByRestaurant[it.restaurant_id] || []).length ? "Log another visit" : "Log visit";
    visit.onclick = () => openVisit(it.restaurant_id, r.name); actions.appendChild(visit);

    const rm = document.createElement("button"); rm.className = "tiny"; rm.textContent = "Remove";
    rm.onclick = () => removeItem(l.id, it.restaurant_id); actions.appendChild(rm);

    card.appendChild(actions);
    el.appendChild(card);
  }
}

async function createList() {
  const inp = document.getElementById("new-list-name");
  const name = inp.value.trim();
  if (!name) return toast("Enter a list name", true);
  try {
    const l = await api("POST", "/lists", { name, type: "custom" });
    inp.value = ""; state.selectedListId = l.id; await loadCore(); render();
    toast("Created “" + name + "”");
  } catch (e) { toast("Create failed: " + e.message, true); }
}
async function renameList(l) {
  const name = prompt("Rename list:", l.name);
  if (name == null || !name.trim() || name === l.name) return;
  try { await api("PATCH", `/lists/${l.id}`, { name: name.trim() }); await loadCore(); render(); toast("Renamed"); }
  catch (e) { toast("Rename failed: " + e.message, true); }
}
async function deleteList(l) {
  if (!confirm(`Delete list “${l.name}”? Items in it are removed.`)) return;
  try {
    await api("DELETE", `/lists/${l.id}`);
    if (state.selectedListId === l.id) state.selectedListId = null;
    await loadCore(); render(); toast("Deleted");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}
async function editItem(listId, it) {
  const note = prompt("Note:", it.note || "");
  if (note == null) return;
  const tagsRaw = prompt("Tags (comma-separated):", (it.tags || []).join(", "));
  if (tagsRaw == null) return;
  const tags = tagsRaw.split(",").map(t => t.trim()).filter(Boolean);
  try { await api("PATCH", `/lists/${listId}/items/${it.restaurant_id}`, { note, tags }); renderItems(); toast("Updated"); }
  catch (e) { toast("Update failed: " + e.message, true); }
}
async function removeItem(listId, restaurantId) {
  try { await api("DELETE", `/lists/${listId}/items/${restaurantId}`); await loadCore(); render(); toast("Removed"); }
  catch (e) { toast("Remove failed: " + e.message, true); }
}

// ---- Modal UX: click backdrop or press Escape to close ----
for (const id of ["visit-modal", "detail-modal"]) {
  document.getElementById(id).addEventListener("click", e => {
    if (e.target.id === id) { id === "visit-modal" ? closeVisit() : closeDetail(); }
  });
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  closeVisit(); closeDetail();
});

// ---- Boot ----
async function boot() {
  await loadUser();
  await loadCore();
  await loadCuisines();
  render();
}
boot();
</script>
</body>
</html>
